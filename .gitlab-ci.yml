# Dusk CI — packages/dusk (fork of Dusk Studio)
# Gate: lint + typecheck + tests + electron-vite build. Packaging (dmg/exe) is a later stage.

image: node:24.15.0

stages:
  - verify
  - test
  - build

variables:
  DUSK_DIR: packages/dusk
  npm_config_engine_strict: "false"

cache:
  key:
    files:
      - packages/dusk/pnpm-lock.yaml
  paths:
    - packages/dusk/node_modules/
    - packages/dusk/.pnpm-store/

.default-setup: &default-setup
  - corepack enable
  - cd $DUSK_DIR
  - pnpm config set store-dir .pnpm-store
  - pnpm install --frozen-lockfile || pnpm install

lint-typecheck:
  stage: verify
  script:
    - *default-setup
    - pnpm run lint # oxlint+eslint+typecheck+i18n check+format — the repo gate

test:
  stage: test
  script:
    - *default-setup
    - pnpm test
  # Some upstream tests assume macOS GUI/network/mise environment; tighten to
  # blocking once the suite is CI-green on this runner.
  allow_failure: true

build:
  stage: build
  script:
    - *default-setup
    - pnpm run build
  artifacts:
    paths:
      - packages/dusk/out/
    expire_in: 1 week
