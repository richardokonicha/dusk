# Release build for the Dusk Electron app, triggered by tags `v*`.
#
# NOTE: installs MUST run inside packages/dusk, never the repo root. The
# patchedDependencies (and the pnpm-workspace.yaml overrides) live in
# packages/dusk/pnpm-workspace.yaml, so every install step uses
# `defaults.run.working-directory: packages/dusk`.
#
# Windows signing is driven by scripts/win-sign.js, which reads:
#   WIN_SIGN              - set to any truthy value to actually sign
#   DUSK_CERT_PATH        - path to the .pfx / cert file
#   DUSK_CERT_KEY         - the key container / password
#   DUSK_CERT_CSP         - the CSP (cryptographic service provider) string
#   WIN_SIGN_TIMESTAMP_URLS - comma-separated timestamp URLs (optional)
name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    name: Build (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macos-arm64
            os: macos-14
            script: build:mac:arm64
            zipScript: build:mac:arm64:zip
          - name: macos-x64
            os: macos-14
            script: build:mac:x64
            zipScript: build:mac:x64:zip
          - name: windows-x64
            os: windows-latest
            script: build:win:x64
          - name: windows-arm64
            os: windows-latest
            script: build:win:arm64
          - name: linux-x64
            os: ubuntu-latest
            script: build:linux:x64
          - name: linux-arm64
            os: ubuntu-latest
            script: build:linux:arm64
    defaults:
      run:
        working-directory: packages/dusk
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24.15'

      # selection-hook compiles X11 code on Linux; the runner image lacks the headers.
      - name: Install X11 build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libx11-dev libxext-dev libxkbcommon-dev

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # electron-builder signs whenever the signing env vars are merely defined,
      # so only export the ones that actually hold a value.
      - name: Export signing credentials
        shell: bash
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          DUSK_CERT_PATH: ${{ secrets.DUSK_CERT_PATH }}
          DUSK_CERT_KEY: ${{ secrets.DUSK_CERT_KEY }}
          DUSK_CERT_CSP: ${{ secrets.DUSK_CERT_CSP }}
          WIN_SIGN_TIMESTAMP_URLS: ${{ secrets.WIN_SIGN_TIMESTAMP_URLS }}
        run: |
          for name in APPLE_ID APPLE_APP_SPECIFIC_PASSWORD APPLE_TEAM_ID CSC_LINK CSC_KEY_PASSWORD DUSK_CERT_PATH DUSK_CERT_KEY DUSK_CERT_CSP WIN_SIGN_TIMESTAMP_URLS; do
            if [ -n "${!name}" ]; then
              echo "export ${name}='${!name}'" >> "$GITHUB_ENV"
            else
              echo "skipping empty ${name}"
            fi
          done
          if [ -n "$DUSK_CERT_PATH" ]; then
            echo "WIN_SIGN=true" >> "$GITHUB_ENV"
          fi

      - name: Detach stale DMG volumes
        if: runner.os == 'macOS'
        run: hdiutil detach -all -quiet 2>/dev/null || true

      # electron-builder self-publishes once it detects a GitHub remote; the
      # publish job below owns the release instead.
      - name: Package
        run: |
          pnpm run ${{ matrix.script }} --publish never || {
            echo "Retrying after hdiutil cleanup"
            hdiutil detach -all -quiet 2>/dev/null || true
            sleep 5
            pnpm run ${{ matrix.script }} --publish never
          } || {
            echo "Falling back to the zip target"
            pnpm run ${{ matrix.zipScript }} --publish never
          }

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.name }}
          path: |
            dist/*.dmg
            dist/*.zip
            dist/*.exe
            dist/*.blockmap
            dist/*.AppImage
            dist/*.deb
            dist/*.rpm
            dist/*.snap
            dist/*.yml
          if-no-files-found: warn

  publish:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: release-*
          merge-multiple: false
          path: dist

      - name: Collect installers
        run: |
          mkdir -p staged
          find dist -type f \( -name '*.dmg' -o -name '*.zip' -o -name '*.exe' -o -name '*.AppImage' -o -name '*.deb' -o -name '*.rpm' -o -name '*.blockmap' -o -name '*.yml' \) \
            -exec cp -n {} staged/ \;

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          name: Dusk ${{ github.ref_name }}
          draft: false
          prerelease: true
          generate_release_notes: true
          files: staged/*

      - name: Report assets
        run: ls -lh staged/