# CI for the Dusk Electron app.
#
# NOTE: installs MUST run inside packages/dusk, never the repo root. The
# patchedDependencies (and the pnpm-workspace.yaml overrides) live in
# packages/dusk/pnpm-workspace.yaml, so every install step uses
# `defaults.run.working-directory: packages/dusk`.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-and-build:
    name: Lint & Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24.15'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        working-directory: packages/dusk

      - name: Lint
        run: pnpm lint
        working-directory: packages/dusk

      - name: Build
        run: pnpm build
        working-directory: packages/dusk

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24.15'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        working-directory: packages/dusk

      - name: Run tests
        run: pnpm test
        working-directory: packages/dusk
        timeout-minutes: 45

  build-desktop:
    name: Desktop build (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macos-arm64
            os: macos-14
            script: build:mac:arm64
          - name: macos-x64
            os: macos-14
            script: build:mac:x64
          - name: windows-x64
            os: windows-latest
            script: build:win:x64
          - name: windows-arm64
            os: windows-latest
            script: build:win:arm64
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24.15'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        working-directory: packages/dusk

      - name: Detach stale DMG volumes
        if: runner.os == 'macOS'
        run: hdiutil detach -quiet /Volumes/Dusk 2>/dev/null || true

      - name: Package
        # hdiutil intermittently fails with "Device not configured" on the macOS
        # runners; one retry clears it.
        run: |
          pnpm run ${{ matrix.script }} || {
            echo "Retrying after hdiutil cleanup"
            hdiutil detach -all -quiet || true
            sleep 5
            pnpm run ${{ matrix.script }}
          }
        working-directory: packages/dusk
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.name }}
          path: |
            packages/dusk/dist/*.dmg
            packages/dusk/dist/*.zip
            packages/dusk/dist/*.exe
            packages/dusk/dist/*.blockmap
            packages/dusk/dist/latest*.yml
          if-no-files-found: error
          retention-days: 14